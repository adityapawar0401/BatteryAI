name: Deploy BatteryAI to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - name: Require the configured remote backend URL
        shell: bash
        env:
          REMOTE_API_URL: ${{ vars.BATTERYAI_REMOTE_API_URL }}
        run: |
          if [ -z "$REMOTE_API_URL" ]; then
            echo "::error::The BATTERYAI_REMOTE_API_URL repository variable is not set."
            exit 1
          fi
          if ! printf '%s' "$REMOTE_API_URL" | grep -qE '^https://[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*\.ts\.net$'; then
            echo "::error::BATTERYAI_REMOTE_API_URL must be an exact HTTPS ts.net origin with no port, path, query, or fragment."
            exit 1
          fi
      - run: npm run build
        working-directory: apps/web
        env:
          VITE_BATTERYAI_REMOTE_MODE: "1"
          VITE_BATTERYAI_REMOTE_API_URL: ${{ vars.BATTERYAI_REMOTE_API_URL }}
          BATTERYAI_PAGES_BASE: ${{ vars.BATTERYAI_PAGES_BASE || '/BatteryAI/' }}
      - name: Verify static artifact
        shell: bash
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/dashboard/index.html
          ! find apps/web/dist -type f \( -name 'model.pt' -o -name '*.mat' -o -name '*.onnx' -o -name '*.onnx.data' -o -name 'landingpage.txt' -o -name 'dashboard.txt' \) | grep .
          ! find apps/web/dist -type f | grep -E '(_inputs|batteryai-gpu-env|local-reports)'
          ! grep -R -E 'C:\\Users\\|Pairing token:|Oxford_Battery_Degradation_Dataset_1\.mat' apps/web/dist
          ! grep -R -i -E 'cdn\.tailwindcss\.com|Transformer-V4|LIVE DATA STREAM|SYSTEMS NOMINAL|Adaptive Charging|Request deployment|99\.8 ?%? ?accuracy|Prediction accuracy' apps/web/dist
          # Rendered markup must carry no internal implementation vocabulary.
          # Bundled JS keeps API contract strings, which the app requires to work.
          ! grep -R -i -E 'Oxford|PIMoE|Ollama|llama3\.2|ONNX|FastAPI|Tailscale|Funnel|GitHub Pages|CUDA|SHA-256|active experts|masked experts|model profile|RUL |next-observed-checkpoint|loopback|host computer' --include='*.html' apps/web/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
